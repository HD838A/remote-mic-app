ound:#f0f0f1;border-radius:8px;padding:9px 12px}.bridge{margin-top:16px;padding-top:14px;border-top:1px solid var(--border-subtle)}.bridge p{margin:4px 0}.badge{color:var(--warning-1);font-weight:600}.buttons{display:flex;gap:10px;margin-top:14px}.buttons button{border:0;border-radius:8px;padding:9px 14px;font:600 12pt var(--font-ui)}.primary{background:var(--accent-1);color:#fff}.secondary{background:#ededee}
