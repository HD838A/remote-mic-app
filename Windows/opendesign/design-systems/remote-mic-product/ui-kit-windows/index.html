<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Mic Windows UI kit</title><link rel="stylesheet" href="../tokens/colors_and_type.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9eaec;color:var(--text-primary);font:var(--body);font-family:var(--font-ui)}
.window{width:900px;height:680px;margin:28px auto;display:grid;grid-template-columns:120px 1fr;background:var(--surface-secondary);border:1px solid var(--border-subtle);border-radius:14px;overflow:hidden;box-shadow:0 18px 60px #0002}
.sidebar{padding:20px 12px;background:var(--bg-nav);border-right:1px solid var(--border-subtle)}.brand{height:46px;display:grid;place-items:center;font-weight:700;color:var(--fg-2)}
.sidebar-item{width:100%;height:76px;margin:6px 0;border:0;border-radius:14px;background:transparent;color:var(--fg-2);font:600 12pt var(--font-ui);display:grid;place-items:center;gap:2px}.sidebar-item.selected{background:var(--selection-fill);color:var(--selection-text)}.sidebar-icon{font-size:22px}
main{padding:30px;overflow:auto}h1{margin:0 0 24px;font:var(--h1)}h2{font:var(--h2);margin:0 0 8px}.grid{display:grid;grid-template-columns:230px 1fr;gap:20px}.card{background:var(--surface-primary);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:22px;box-shadow:var(--shadow-card)}
.device{text-align:center}.device img{height:270px;max-width:100%;object-fit:contain}.line{display:flex;align-items:center;justify-content:space-between;margin-top:12px;text-align:left}.muted{color:var(--text-secondary);font:var(--caption)}.pill{padding:5px 10px;border-radius:999px;background:var(--success-soft);color:var(--success-1);font-weight:600}
.form-row{display:grid;grid-template-columns:110px 1fr;align-items:center;margin:14px 0}.control{padding:10px 12px;border-radius:var(--radius-control);background:#f0f0f1;border:1px solid transparent}.actions{display:flex;gap:10px;margin-top:18px}.button{padding:9px 16px;border:0;border-radius:8px;font:600 12pt var(--font-ui)}.primary{background:var(--accent-1);color:white}.secondary{background:#ededee;color:var(--fg-1)}
</style></head><body><div class="window"><aside class="sidebar"><div class="brand">Remote Mic</div><button class="sidebar-item selected"><span class="sidebar-icon">↗</span><span>连接</span></button><button class="sidebar-item"><span class="sidebar-icon">⌨</span><span>按键</span></button><button class="sidebar-item"><span class="sidebar-icon">▦</span><span>统计</span></button><button class="sidebar-item"><span class="sidebar-icon">◉</span><span>权限</span></button><button class="sidebar-item"><span class="sidebar-icon">✓</span><span>检查</span></button></aside><main><h1>连接与语音</h1><div class="grid"><section class="card device"><h2>小米蓝牙遥控器 2 Pro</h2><p class="muted">语音遥控器</p><img src="../assets/imagery/RC003-remote-photo.png" alt="RC003 遥控器"><div class="line"><span>蓝牙状态</span><span class="pill">等待设备</span></div><p class="muted">拿到遥控器后进行连接和语音验收。</p><button class="button primary">重新检测</button></section><section class="card"><h2>语音设置</h2><div class="form-row"><span>语音输出</span><div class="control">尚未选择</div></div><div class="form-row"><span>触发方式</span><div class="control">免按住（右 Alt + 空格）</div></div><div class="form-row"><span>语音热键</span><div class="control">ralt+space</div></div><p class="muted">语音只写入当前选中的输出设备；设备缺失时，普通按键仍可使用。</p><div class="actions"><button class="button primary">保存并启动</button><button class="button secondary">打开日志目录</button></div></section></div></main></div></body></html>
