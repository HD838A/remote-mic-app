name: SayAll Agent Analyze

run-name: SayAll Agent analyze ${{ github.event.client_payload.run_id || github.run_id }}

on:
  repository_dispatch:
    types: [sayall-agent-analyze]

permissions: {}

concurrency:
  group: sayall-agent-analyze-${{ github.repository_id }}-${{ github.event.client_payload.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Redeem one-time analysis authorization
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      run_id: ${{ steps.validate.outputs.run_id }}
      issue_number: ${{ steps.redeem.outputs.issue_number }}
      base_ref: ${{ steps.redeem.outputs.base_ref }}
      base_sha: ${{ steps.redeem.outputs.base_sha }}
      repository: ${{ steps.redeem.outputs.repository }}
    steps:
      - name: Validate dispatch envelope
        id: validate
        shell: bash
        env:
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2129
          [[ "$RUN_ID" =~ ^run_[A-Za-z0-9_-]{12,80}$ ]]
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Redeem authorization at Workshop
        id: redeem
        shell: bash
        env:
          API_URL: ${{ vars.WORKSHOP_AGENT_API_URL }}
          CALLBACK_SECRET: ${{ secrets.WORKSHOP_AGENT_CALLBACK_SECRET }}
          RUN_ID: ${{ steps.validate.outputs.run_id }}
          DISPATCH_TOKEN: ${{ github.event.client_payload.dispatch_token }}
        run: |
          set -euo pipefail
          test -n "$API_URL"
          test -n "$CALLBACK_SECRET"
          [[ "$DISPATCH_TOKEN" =~ ^sad_[A-Za-z0-9_-]{40,120}$ ]]
          body='{"phase":"analyze"}'
          timestamp="$(date +%s)"
          event_id="evt_${RUN_ID}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_analyze"
          signature="$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')"
          response_file="$RUNNER_TEMP/sayall-agent-context.json"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "${API_URL%/}/api/agent/dispatches/${DISPATCH_TOKEN}/redeem" \
            --header "Content-Type: application/json" \
            --header "X-SayAll-Timestamp: $timestamp" \
            --header "X-SayAll-Event-Id: $event_id" \
            --header "X-SayAll-Signature: $signature" \
            --data-binary "$body" > "$response_file"
          jq -e --arg run "$RUN_ID" --arg repository "$GITHUB_REPOSITORY" '.runId == $run and .phase == "analyze" and .repository == $repository and (.issueNumber | type == "number" and . > 0)' "$response_file" > /dev/null
          jq -r '.baseRef' "$response_file" | grep -Eq '^[A-Za-z0-9._/-]{1,200}$'
          jq -r '.baseSha' "$response_file" | grep -Eq '^[0-9a-f]{40}$'
          {
            echo "base_ref=$(jq -r '.baseRef' "$response_file")"
            echo "base_sha=$(jq -r '.baseSha' "$response_file")"
            echo "repository=$(jq -r '.repository' "$response_file")"
            echo "issue_number=$(jq -r '.issueNumber' "$response_file")"
          } >> "$GITHUB_OUTPUT"

      - name: Upload redeemed context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sayall-agent-analyze-context-${{ github.run_id }}
          path: ${{ runner.temp }}/sayall-agent-context.json
          if-no-files-found: error
          retention-days: 1

  analyze:
    name: Read-only Codex triage
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Check out fixed base commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download redeemed context
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v5
        with:
          name: sayall-agent-analyze-context-${{ github.run_id }}
          path: .sayall-input

      - name: Snapshot untrusted GitHub material
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ needs.preflight.outputs.repository }}
          ISSUE_NUMBER: ${{ needs.preflight.outputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .sayall-input
          gh api "repos/$TARGET_REPOSITORY/issues/$ISSUE_NUMBER" > .sayall-input/issue.json
          gh api --paginate --slurp "repos/$TARGET_REPOSITORY/issues?state=all&per_page=100" > .sayall-input/issues.json
          gh api --paginate --slurp "repos/$TARGET_REPOSITORY/pulls?state=all&per_page=100" > .sayall-input/pulls.json
          gh api "repos/$TARGET_REPOSITORY/releases?per_page=100" > .sayall-input/releases.json
          git log --oneline --decorate -40 > .sayall-input/recent-commits.txt
          git tag --sort=-creatordate | head -40 > .sayall-input/recent-tags.txt

      - name: Run read-only Codex
        id: codex
        continue-on-error: true
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e # codex-action v1 / CLI 0.149.0
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/analyze.md
          output-schema-file: .github/codex/schemas/analysis.schema.json
          output-file: ${{ runner.temp }}/sayall-agent-analysis.json
          permission-profile: :read-only
          safety-strategy: drop-sudo
          codex-version: "0.149.0"
          codex-args: '["--ephemeral"]'
          codex-home: ${{ runner.temp }}/sayall-codex-home
          allow-bot-users: ${{ vars.SAYALL_AGENT_TRIGGER_BOT_LOGIN }}
          model: ${{ vars.SAYALL_CODEX_MODEL }}
          effort: high

      - name: Validate and report analysis
        if: always()
        shell: bash
        env:
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          RESULT_FILE: ${{ runner.temp }}/sayall-agent-analysis.json
          API_URL: ${{ vars.WORKSHOP_AGENT_API_URL }}
          CALLBACK_SECRET: ${{ secrets.WORKSHOP_AGENT_CALLBACK_SECRET }}
          RUN_ID: ${{ needs.preflight.outputs.run_id }}
        run: |
          set -euo pipefail
          test -n "$API_URL"
          test -n "$CALLBACK_SECRET"
          timestamp="$(date +%s)"
          event_id="evt_${RUN_ID}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_analysis_result"
          callback() {
            local payload="$1"
            local callback_signature
            callback_signature="$(printf '%s.%s' "$timestamp" "$payload" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')"
            printf '%s' "$payload" > "$RUNNER_TEMP/sayall-agent-callback.json"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --url "${API_URL%/}/api/agent/events" \
              --header "Content-Type: application/json" \
              --header "X-SayAll-Timestamp: $timestamp" \
              --header "X-SayAll-Event-Id: $event_id" \
              --header "X-SayAll-Signature: $callback_signature" \
              --data-binary @"$RUNNER_TEMP/sayall-agent-callback.json" > /dev/null
          }
          if [[ "$CODEX_OUTCOME" != "success" || ! -s "$RESULT_FILE" ]]; then
            callback "$(jq -cn --arg run "$RUN_ID" --arg error "Codex 只读初检未成功。" --argjson workflowRunId "$GITHUB_RUN_ID" '{runId:$run,eventType:"failed",workflowRunId:$workflowRunId,occurredAt:(now|todateiso8601),error:$error}')"
            exit 1
          fi
          if ! jq -e '
            .schemaVersion == 1 and
            (.decision | IN("already_implemented","fixed_unreleased","duplicate_requirement","duplicate_bug","regression","usage_or_configuration","needs_info","cannot_reproduce","valid_bug","valid_feature","security_sensitive","out_of_scope")) and
            (.confidence >= 0 and .confidence <= 1) and
            (.summary | type == "string" and length >= 2 and length <= 2000) and
            (.publicMessage | type == "string" and length >= 2 and length <= 3000) and
            (.riskLevel | IN("low","medium","high","forbidden")) and
            (.evidence | type == "array" and length <= 30) and
            (.duplicateCandidates | type == "array" and length <= 20) and
            (.affectedPaths | type == "array" and length <= 80) and
            (.implementationSteps | type == "array" and length <= 30) and
            (.testPlan | type == "array" and length <= 30) and
            (if .decision == "already_implemented" or .decision == "fixed_unreleased" then (.evidence | length > 0) else true end) and
            (if .decision == "duplicate_bug" or .decision == "duplicate_requirement" then (.duplicateCandidates | length > 0) else true end) and
            (if .decision == "valid_bug" or .decision == "valid_feature" or .decision == "regression" then ((.affectedPaths|length)>0 and (.implementationSteps|length)>0 and (.testPlan|length)>0) else true end)
          ' "$RESULT_FILE" > /dev/null; then
            callback "$(jq -cn --arg run "$RUN_ID" --arg error "Codex 初检结果未通过确定性策略校验。" --argjson workflowRunId "$GITHUB_RUN_ID" '{runId:$run,eventType:"failed",workflowRunId:$workflowRunId,occurredAt:(now|todateiso8601),error:$error}')"
            exit 1
          fi
          analysis="$(jq -c . "$RESULT_FILE")"
          callback "$(jq -cn --arg run "$RUN_ID" --argjson workflowRunId "$GITHUB_RUN_ID" --argjson analysis "$analysis" '{runId:$run,eventType:"analysis_completed",workflowRunId:$workflowRunId,occurredAt:(now|todateiso8601),analysis:$analysis}')"

      - name: Upload analysis result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sayall-agent-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/sayall-agent-analysis.json
          if-no-files-found: ignore
          retention-days: 1

  report-preflight-failure:
    name: Report preflight failure
    needs: preflight
    if: always() && needs.preflight.result == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report failure to Workshop
        shell: bash
        env:
          API_URL: ${{ vars.WORKSHOP_AGENT_API_URL }}
          CALLBACK_SECRET: ${{ secrets.WORKSHOP_AGENT_CALLBACK_SECRET }}
          RUN_ID: ${{ github.event.client_payload.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^run_[A-Za-z0-9_-]{12,80}$ ]]
          test -n "$API_URL"
          test -n "$CALLBACK_SECRET"
          timestamp="$(date +%s)"
          event_id="evt_${RUN_ID}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_preflight_failure"
          payload="$(jq -cn --arg run "$RUN_ID" --argjson workflowRunId "$GITHUB_RUN_ID" '{runId:$run,eventType:"failed",workflowRunId:$workflowRunId,occurredAt:(now|todateiso8601),error:"Agent 初检 Preflight 未通过。"}')"
          signature="$(printf '%s.%s' "$timestamp" "$payload" | openssl dgst -sha256 -hmac "$CALLBACK_SECRET" -hex | awk '{print $2}')"
          printf '%s' "$payload" > "$RUNNER_TEMP/sayall-agent-callback.json"
          curl --silent --show-error --fail-with-body \
            --request POST \
            --url "${API_URL%/}/api/agent/events" \
            --header "Content-Type: application/json" \
            --header "X-SayAll-Timestamp: $timestamp" \
            --header "X-SayAll-Event-Id: $event_id" \
            --header "X-SayAll-Signature: $signature" \
            --data-binary @"$RUNNER_TEMP/sayall-agent-callback.json" > /dev/null
