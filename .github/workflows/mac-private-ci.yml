name: macOS private integration CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private_validation_location:
    name: Use private host integration validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public host selector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Explain the private validation boundary
        run: |
          echo "Run macos-host-integration.yml in GetSayAll/sayall-private-platform for the exact public host commit."
          printf 'host_commit=%s\n' "$(git rev-parse HEAD)"
          jq -r '.dependencies.sayAllPrivatePlatform.version' config/release-dependencies.json
          echo "Private source integration runs in the private repository or on the maintainer machine."
          exit 1
