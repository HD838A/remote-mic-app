name: Release Guard

on:
  release:
    types: [published, released, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Verified pre-release tag whose candidate commit should be recorded in main
        required: true
        type: string

concurrency:
  group: release-guard-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.release.draft == false
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Reconcile release provenance
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_RELEASE_ACTORS: HD838A
        run: |
          ./scripts/reconcile-release-event.sh \
            "${{ github.event.inputs.tag || github.event.release.tag_name }}" \
            "${{ github.actor }}" \
            "${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}"
