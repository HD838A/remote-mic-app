name: macOS Preview Candidate

on:
  push:
    branches:
      - "release/pre-v*"
  workflow_dispatch:

concurrency:
  group: mac-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and package preview candidate (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 75
    environment: mac-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apple-silicon
            label: Apple Silicon
            artifact: mac-preview-apple-silicon
          - variant: intel
            label: Intel Ventura
            artifact: mac-preview-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VARIANT: ${{ matrix.variant }}
      EXPECTED_DEVELOPER_TEAM_ID: L3QHLDRPAY
      PARALLEL_PACKAGE_NOTARIZATION: 1
      RELEASE_STAGE_TIMEOUTS: 1
      REMOTE_WEB_RELAY_URL: ${{ secrets.REMOTE_WEB_RELAY_URL }}
      EARLY_ACCESS_SERVICE_URL: ${{ secrets.EARLY_ACCESS_SERVICE_URL }}

    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out private feature package
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-ai
          ref: 01beeceac9c4091e7e8e122ad1e840ac5e5cee1c
          path: .private-dependencies/sayall-ai
          ssh-key: ${{ secrets.SAYALL_AI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out private macro package
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-macro-platform
          ref: 734f24be4f6ebeacadeaa41d9902bdf414807d06
          path: .private-dependencies/sayall-macro-platform
          ssh-key: ${{ secrets.SAYALL_MACRO_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure private feature package
        run: |
          echo "SAYALL_AI_PACKAGE_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-ai" >> "$GITHUB_ENV"
          echo "SAYALL_MACRO_PLATFORM_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-macro-platform" >> "$GITHUB_ENV"
          echo "REQUIRE_SAYALL_AI_PACKAGE=1" >> "$GITHUB_ENV"
          echo "REQUIRE_SAYALL_MACRO_PLATFORM=1" >> "$GITHUB_ENV"

      - name: Check out shared Mac remote package
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-mac-remote
          ref: 04a1bf2b713ee98c4d2c07cd690bb4b26288a82d
          path: .private-dependencies/sayall-mac-remote
          ssh-key: ${{ secrets.SAYALL_MAC_REMOTE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out readonly release credentials
        uses: actions/checkout@v5
        with:
          repository: HD838A/remotemic-notary-secrets
          path: .private-release/remotemic-notary-secrets
          ssh-key: ${{ secrets.RELEASE_CREDENTIALS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out readonly Match signing identities
        uses: actions/checkout@v5
        with:
          repository: HD838A/apple-signing-match
          path: .private-release/apple-signing-match
          ssh-key: ${{ secrets.APPLE_SIGNING_MATCH_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure shared Mac remote package
        run: swift package config set-mirror --original https://github.com/GetSayAll/sayall-mac-remote.git --mirror "file://$GITHUB_WORKSPACE/.private-dependencies/sayall-mac-remote"

      - name: Install required tools
        run: |
          missing_formulae=()
          command -v age >/dev/null || missing_formulae+=(age)
          command -v fastlane >/dev/null || missing_formulae+=(fastlane)
          command -v rg >/dev/null || missing_formulae+=(ripgrep)
          if (( ${#missing_formulae[@]} != 0 )); then
            brew install "${missing_formulae[@]}"
          fi
          age --version
          fastlane --version
          rg --version

      - name: Prepare protected preview signing identity
        env:
          RELEASE_AGE_IDENTITY: ${{ secrets.RELEASE_AGE_IDENTITY }}
        run: |
          test -n "$RELEASE_AGE_IDENTITY"
          release_identity="$RUNNER_TEMP/remotemic-preview.agekey"
          umask 077
          printf '%s' "$RELEASE_AGE_IDENTITY" > "$release_identity"
          chmod 600 "$release_identity"
          {
            echo "AGE_IDENTITY_FILE=$release_identity"
            echo "RELEASE_CREDENTIALS_REPO=$GITHUB_WORKSPACE/.private-release/remotemic-notary-secrets"
            echo "MATCH_REPO=$GITHUB_WORKSPACE/.private-release/apple-signing-match"
          } >> "$GITHUB_ENV"

      - name: Validate candidate branch provenance
        run: |
          ./scripts/verify-preview-branch.sh
          ./scripts/verify-release-dependency-pins.sh

      - name: Run Swift tests
        run: swift test

      - name: Run core first-voice journey gate
        run: |
          swift test --filter VoiceInputDestinationCoordinatorTests
          swift test --filter CoreVoiceInputJourneyTests

      - name: Run project self-test
        run: SKIP_SWIFT_PACKAGE_BUILD=1 ./scripts/test.sh

      - name: Build, sign, notarize, and verify candidate DMG
        timeout-minutes: 15
        run: ./scripts/package-macos-preview-in-actions.sh

      - name: Upload CI candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            ${{ matrix.variant == 'intel' && 'dist/intel/Remote-Mic-*-Intel.dmg' || 'dist/Remote-Mic-*.dmg' }}
            ${{ matrix.variant == 'intel' && 'dist/intel/Remote-Mic-*-Intel.dmg.sha256' || 'dist/Remote-Mic-*.dmg.sha256' }}
            ${{ matrix.variant == 'intel' && 'dist/intel/Install Remote Mic Intel.pkg' || 'dist/Install Remote Mic.pkg' }}
            ${{ matrix.variant == 'intel' && 'dist/intel/Uninstall Remote Mic Intel.pkg' || 'dist/Uninstall Remote Mic.pkg' }}
          if-no-files-found: error
          retention-days: 14
