name: macOS Preview Candidate

on:
  push:
    branches:
      - "release/pre-v*"
  workflow_dispatch:

concurrency:
  group: mac-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  SAYALL_AI_RELEASE_REF: 01beeceac9c4091e7e8e122ad1e840ac5e5cee1c
  SAYALL_MACRO_PLATFORM_RELEASE_REF: 5801ec92d937e20d1d05945a27212168298db554
  SAYALL_MAC_REMOTE_RELEASE_REF: 3f3c782180eef4024b53941c1f65d80e7cff4c66

jobs:
  classify-candidate:
    name: Classify exact parent-main CI reuse
    runs-on: macos-15
    timeout-minutes: 3
    outputs:
      reuse_parent_main_ci: ${{ steps.reuse.outputs.eligible }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Test strict metadata-only and exact parent-main proof
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eligible=false
          base_sha="$(git rev-parse HEAD^)"
          trusted_runner="$RUNNER_TEMP/run-trusted-release-validation.sh"
          if git show "${base_sha}:scripts/run-trusted-release-validation.sh" > "$trusted_runner" &&
             chmod 755 "$trusted_runner" &&
             REPOSITORY_ROOT="$GITHUB_WORKSPACE" ALLOW_FROZEN_BASE_MAIN=1 \
               "$trusted_runner"; then
            eligible=true
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "PARENT MAIN CI REUSE ELIGIBLE: $eligible"

  validate-and-package:
    name: Validate and package preview candidate (${{ matrix.label }})
    if: ${{ needs.classify-candidate.outputs.reuse_parent_main_ci == 'true' }}
    needs: classify-candidate
    runs-on: macos-15
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apple-silicon
            label: Apple Silicon
            artifact: mac-preview-apple-silicon
          - variant: intel
            label: Intel Ventura
            artifact: mac-preview-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install required validation tools
        run: |
          command -v jq >/dev/null
          command -v rg >/dev/null || {
            if [[ "$RUNNER_OS" == "macOS" ]]; then brew install ripgrep; else exit 1; fi
          }

      - name: Reuse exact parent main product-code proof
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_READY_PROOF_OUTPUT: ${{ runner.temp }}/release-ready-main-ci-${{ matrix.variant }}.json
        run: |
          base_sha="$(git rev-parse HEAD^)"
          trusted_runner="$RUNNER_TEMP/run-trusted-release-validation.sh"
          git show "${base_sha}:scripts/run-trusted-release-validation.sh" > "$trusted_runner"
          chmod 755 "$trusted_runner"
          REPOSITORY_ROOT="$GITHUB_WORKSPACE" ALLOW_FROZEN_BASE_MAIN=1 \
            "$trusted_runner"

      - name: Upload exact-SHA release-ready proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}-release-ready-proof
          path: ${{ runner.temp }}/release-ready-main-ci-${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 14

  reject-ineligible-candidate:
    name: Reject preview candidate without reusable parent-main proof
    if: ${{ needs.classify-candidate.outputs.reuse_parent_main_ci != 'true' }}
    needs: classify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require the recording PR to be the sole full-CI producer
        run: |
          echo "Preview candidates must be strict metadata-only children of a passing main commit." >&2
          echo "The recording PR is the only full-CI producer when reuse is ineligible; Preview will not duplicate it." >&2
          exit 1
