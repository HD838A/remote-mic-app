name: macOS Preview Candidate

on:
  push:
    branches:
      - "release/pre-v*"
  workflow_dispatch:

concurrency:
  group: mac-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  SAYALL_AI_RELEASE_REF: 01beeceac9c4091e7e8e122ad1e840ac5e5cee1c
  SAYALL_MACRO_PLATFORM_RELEASE_REF: 734f24be4f6ebeacadeaa41d9902bdf414807d06
  SAYALL_MAC_REMOTE_RELEASE_REF: 04a1bf2b713ee98c4d2c07cd690bb4b26288a82d

jobs:
  skip-release-canary:
    name: Skip preview packaging for protected release canary
    if: ${{ contains(github.ref_name, '-canary-') }}
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Confirm dedicated canary ref
        run: |
          printf '%s' "$GITHUB_REF_NAME" | \
            grep -Eq '^release/pre-v[0-9]+\.[0-9]+\.[0-9]+-canary-[a-z0-9][a-z0-9._-]*$'
          echo "PREVIEW CANDIDATE PACKAGING SKIPPED FOR RELEASE CANARY"

  validate-and-package:
    name: Validate and package preview candidate (${{ matrix.label }})
    if: ${{ !contains(github.ref_name, '-canary-') }}
    runs-on: macos-15
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apple-silicon
            label: Apple Silicon
            artifact: mac-preview-apple-silicon
          - variant: intel
            label: Intel Ventura
            artifact: mac-preview-intel
    steps:
      - name: Check out candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install required tools
        run: |
          missing_formulae=()
          command -v jq >/dev/null || missing_formulae+=(jq)
          command -v rg >/dev/null || missing_formulae+=(ripgrep)
          if (( ${#missing_formulae[@]} != 0 )); then
            brew install "${missing_formulae[@]}"
          fi

      - name: Validate metadata-only candidate and reuse release-ready main CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_READY_PROOF_OUTPUT: ${{ runner.temp }}/release-ready-main-ci-${{ matrix.variant }}.json
        run: |
          ./scripts/verify-preview-branch.sh
          ./scripts/verify-release-dependency-pins.sh
          ./scripts/verify-release-ready-main-ci.sh "$(git rev-parse HEAD^)"

      - name: Upload exact-SHA release-ready proof
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}-release-ready-proof
          path: ${{ runner.temp }}/release-ready-main-ci-${{ matrix.variant }}.json
          if-no-files-found: error
          retention-days: 14
