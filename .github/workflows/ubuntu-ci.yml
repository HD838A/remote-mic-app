name: Ubuntu desktop
on:
  push:
    branches: [main]
    paths: &ubuntu-paths
      - 'Apps/Ubuntu/**'
      - 'Sources/RemoteMic/ATVVProtocol.swift'
      - 'Tests/Ubuntu/**'
      - 'Testing/Ubuntu.md'
      - 'packaging/ubuntu/**'
      - '.github/workflows/ubuntu-ci.yml'
  pull_request:
    branches: [main]
    paths: *ubuntu-paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_RELEASE_DEBUG: 0
      SAYALL_TEST_FRONTEND: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install Ubuntu build and desktop test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev python3-dbus python3-gi python3-pil gir1.2-atspi-2.0 xvfb xauth xdotool scrot dbus-x11 fonts-noto-cjk
          npm install -g pnpm@10.15.0
          rustup update stable --no-self-update
      - name: Compile the shared audio library with Swift 6.2
        run: |
          mkdir -p .build/ubuntu
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src \
            swift:6.2-noble@sha256:e508ef1e4be68087f720de622b91cbf1e32799a7aa96134b35e6f1a1d656db7a \
            sh -ec 'apt-get update -qq && apt-get install -y --no-install-recommends make binutils > /dev/null &&
              make -f packaging/ubuntu/Makefile .build/ubuntu/libatvv.so .build/ubuntu/Swift-LICENSE.txt'
      - name: Test and build the public Ubuntu desktop package
        run: make -f packaging/ubuntu/Makefile test package VERSION=0~ci+${GITHUB_SHA}
      - name: Launch the packaged desktop and capture its real windows
        run: |
          dpkg-deb -x .build/ubuntu/*.deb "$RUNNER_TEMP/sayall"
          xvfb-run -a -s "-screen 0 1440x1000x24" dbus-run-session -- \
            sh Tests/Ubuntu/smoke-desktop.sh "$RUNNER_TEMP/sayall/usr/bin/sayall-ubuntu" .build/ubuntu/screenshots
      - name: Upload Ubuntu test package and desktop screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sayall-ubuntu-amd64
          path: |
            .build/ubuntu/*.deb
            .build/ubuntu/screenshots/*.png
          include-hidden-files: true
          if-no-files-found: error
