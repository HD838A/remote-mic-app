name: macOS CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: mac-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift tests and build (${{ matrix.label }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apple-silicon
            label: Apple Silicon
            triple: arm64-apple-macosx14.0
          - variant: intel
            label: Intel Ventura
            triple: x86_64-apple-macosx13.0
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out private feature package
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-ai
          ref: 01beeceac9c4091e7e8e122ad1e840ac5e5cee1c
          path: .private-dependencies/sayall-ai
          ssh-key: ${{ secrets.SAYALL_AI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out private macro package
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-macro-platform
          ref: 955e7eccaf68ec463d0c8927513691000f567f2c
          path: .private-dependencies/sayall-macro-platform
          ssh-key: ${{ secrets.SAYALL_MACRO_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure private feature package
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          echo "SAYALL_AI_PACKAGE_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-ai" >> "$GITHUB_ENV"
          echo "SAYALL_MACRO_PLATFORM_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-macro-platform" >> "$GITHUB_ENV"

      - name: Check out shared Mac remote package
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-mac-remote
          ref: fdecd7d24369dee40c91aac3a78c8e844854530f
          path: .private-dependencies/sayall-mac-remote
          ssh-key: ${{ secrets.SAYALL_MAC_REMOTE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure shared Mac remote package
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: swift package config set-mirror --original https://github.com/GetSayAll/sayall-mac-remote.git --mirror "file://$GITHUB_WORKSPACE/.private-dependencies/sayall-mac-remote"

      - name: Show toolchain
        run: swift --version

      - name: Check patch formatting
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..HEAD"
          fi

      - name: Enforce extracted repository boundaries
        run: ./scripts/check-repository-boundaries.sh

      - name: Verify release dependency pins stay aligned
        run: ./scripts/verify-release-dependency-pins.sh

      - name: Run Swift tests
        run: swift test

      - name: Run core first-voice journey gate
        run: |
          swift test --filter VoiceInputDestinationCoordinatorTests
          swift test --filter CoreVoiceInputJourneyTests

      - name: Run project self-test
        run: ./scripts/test.sh

      - name: Build release configuration
        run: swift build -c release --triple "${{ matrix.triple }}"
