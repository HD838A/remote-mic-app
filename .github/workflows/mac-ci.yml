name: macOS CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'hotfix/**']

concurrency:
  # Keep every source SHA proof, including pending main/hotfix runs.
  group: mac-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  classify_changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      release_control_plane_only: ${{ steps.changes.outputs.release_control_plane_only }}
      product_change: ${{ steps.changes.outputs.product_change }}
      tooling_only: ${{ steps.changes.outputs.tooling_only }}
      repository_only: ${{ steps.changes.outputs.repository_only }}
      release_checks: ${{ steps.changes.outputs.release_checks }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            {
              printf '%s\n' docs_only=false release_control_plane_only=false tooling_only=false repository_only=false product_change=true release_checks=true
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            diff_range="$PR_BASE_SHA...HEAD"
          else
            before_sha="${{ github.event.before }}"
            if [[ -z "$before_sha" || "$before_sha" == 0000000000000000000000000000000000000000 ]]; then
              {
                printf '%s\n' docs_only=false release_control_plane_only=false tooling_only=false repository_only=false product_change=true release_checks=true
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            diff_range="$before_sha..HEAD"
          fi

          base_sha="${diff_range%%.*}"
          ./scripts/verify-release-control-plane-diff.sh --classify "$base_sha" HEAD >> "$GITHUB_OUTPUT"

  public_test:
    name: Public Swift tests and build (${{ matrix.label }})
    needs: classify_changes
    runs-on: ${{ needs.classify_changes.outputs.product_change == 'true' && 'macos-15' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apple-silicon
            label: Apple Silicon
            triple: arm64-apple-macosx14.0
          - variant: intel
            label: Intel Ventura
            triple: x86_64-apple-macosx13.0
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Check patch formatting
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != 0000000000000000000000000000000000000000 ]]; then
            git diff --check "${{ github.event.before }}..HEAD"
          fi

      - name: Run documentation checks
        if: needs.classify_changes.outputs.docs_only == 'true'
        run: |
          # 删除的文件不会存在于工作区：用 --diff-filter=d 排除它们，否则任何删除
          # .md 或 Screenshots 的文档 PR 都会在这一步必然失败。
          for file in $(git diff --diff-filter=d --name-only HEAD^ HEAD -- '*.md' 'Screenshots/*'); do
            test -f "$file"
          done
          echo "Documentation-only change passed."

      - name: Run tooling checks
        if: needs.classify_changes.outputs.tooling_only == 'true'
        run: echo "Manual developer tooling only; product and release checks are not applicable."

      - name: Run repository checks
        if: needs.classify_changes.outputs.repository_only == 'true'
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GOVERNANCE_PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
          GOVERNANCE_PR_IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft || false }}
        run: |
          ./scripts/verify-repository-governance.sh "$GOVERNANCE_BASE_SHA"
          echo "Repository-only change passed; product and release checks are not applicable."

      - name: Enforce repository boundaries
        if: needs.classify_changes.outputs.product_change == 'true'
        run: ./scripts/check-repository-boundaries.sh

      - name: Show toolchain
        if: needs.classify_changes.outputs.product_change == 'true'
        run: swift --version

      - name: Verify release configuration
        if: needs.classify_changes.outputs.product_change == 'true' && needs.classify_changes.outputs.release_checks == 'true'
        run: |
          ./scripts/verify-release-dependency-pins.sh
          ./scripts/verify-release-dependency-pins.sh tokens

      - name: Run Swift tests
        if: needs.classify_changes.outputs.product_change == 'true'
        env:
          SAYALL_AI_PACKAGE_PATH: ""
          SAYALL_COMBINATION_ACTIONS_PATH: ""
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ""
          SAYALL_MAC_REMOTE_PACKAGE_PATH: ""
        run: swift test --disable-keychain --skip BuildSigningTests

      - name: Run core first-voice journey gate
        if: needs.classify_changes.outputs.product_change == 'true'
        env:
          SAYALL_AI_PACKAGE_PATH: ""
          SAYALL_COMBINATION_ACTIONS_PATH: ""
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ""
          SAYALL_MAC_REMOTE_PACKAGE_PATH: ""
        run: |
          swift test --disable-keychain --filter VoiceInputDestinationCoordinatorTests
          swift test --disable-keychain --filter CoreVoiceInputJourneyTests

      - name: Run release control-plane fixture
        if: needs.classify_changes.outputs.product_change == 'true' && needs.classify_changes.outputs.release_checks == 'true'
        env:
          SAYALL_AI_PACKAGE_PATH: ""
          SAYALL_COMBINATION_ACTIONS_PATH: ""
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ""
          SAYALL_MAC_REMOTE_PACKAGE_PATH: ""
        # Reuse the product test binary; no additional Mac compilation.
        run: |
          command -v rg >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          swift test --disable-keychain --skip-build --filter BuildSigningTests

      - name: Run project self-test
        if: needs.classify_changes.outputs.product_change == 'true'
        run: SKIP_SWIFT_PACKAGE_BUILD=1 ./scripts/test.sh

      - name: Build release configuration
        if: needs.classify_changes.outputs.product_change == 'true'
        env:
          SAYALL_AI_PACKAGE_PATH: ""
          SAYALL_COMBINATION_ACTIONS_PATH: ""
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ""
          SAYALL_MAC_REMOTE_PACKAGE_PATH: ""
        run: swift build --disable-keychain -c release --triple "${{ matrix.triple }}"

  release_checks:
    name: Release script checks (${{ matrix.label }})
    needs: [classify_changes, public_test]
    if: needs.classify_changes.outputs.release_checks == 'true'
    runs-on: ${{ needs.classify_changes.outputs.product_change == 'true' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apple-silicon
            label: Apple Silicon
          - variant: intel
            label: Intel Ventura
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VARIANT: ${{ matrix.variant }}
    steps:
      - name: Check out repository
        if: needs.classify_changes.outputs.product_change != 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify release configuration
        if: needs.classify_changes.outputs.product_change != 'true'
        run: |
          ./scripts/verify-release-dependency-pins.sh
          ./scripts/verify-release-dependency-pins.sh tokens
      - name: Run release control-plane fixture
        if: needs.classify_changes.outputs.product_change != 'true'
        # BuildSigningTests executes the consolidated shell fixture itself.
        run: |
          command -v rg >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
          swift test --disable-keychain --filter BuildSigningTests

      - name: Require release checks from product lanes
        if: needs.classify_changes.outputs.product_change == 'true'
        env:
          PUBLIC_RESULT: ${{ needs.public_test.result }}
        run: test "$PUBLIC_RESULT" = success

  private_access:
    name: Detect private dependency access
    needs: classify_changes
    if: needs.classify_changes.outputs.product_change == 'true'
    runs-on: macos-15
    outputs:
      available: ${{ steps.private-access.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve versioned release dependencies
        id: release-dependencies
        run: ./scripts/verify-release-dependency-pins.sh resolve github-output

      - name: Detect private dependency access
        id: private-access
        shell: bash
        env:
          SAYALL_AI_DEPLOY_KEY: ${{ secrets.SAYALL_AI_DEPLOY_KEY }}
          SAYALL_PRIVATE_PLATFORM_DEPLOY_KEY: ${{ secrets.SAYALL_PRIVATE_PLATFORM_DEPLOY_KEY }}
          SAYALL_MAC_REMOTE_DEPLOY_KEY: ${{ secrets.SAYALL_MAC_REMOTE_DEPLOY_KEY }}
        run: |
          available=true
          check_access() {
            local repository="$1"
            local key="$2"
            if [[ -z "$key" ]]; then
              available=false
              return
            fi
            eval "$(ssh-agent -s)" >/dev/null
            if ! printf '%s\n' "$key" | ssh-add - >/dev/null 2>&1 || \
               ! GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=accept-new' \
                 git ls-remote "git@github.com:$repository.git" HEAD >/dev/null 2>&1; then
              available=false
            fi
            ssh-agent -k >/dev/null
          }
          check_access "${{ steps.release-dependencies.outputs.sayall_ai_repository }}" "$SAYALL_AI_DEPLOY_KEY"
          check_access "${{ steps.release-dependencies.outputs.sayall_private_platform_repository }}" "$SAYALL_PRIVATE_PLATFORM_DEPLOY_KEY"
          check_access "${{ steps.release-dependencies.outputs.sayall_mac_remote_repository }}" "$SAYALL_MAC_REMOTE_DEPLOY_KEY"
          echo "available=$available" >> "$GITHUB_OUTPUT"
          if [[ "$available" == true ]]; then
            echo "Private dependency access is available; private integration checks will run."
          else
            echo "Private dependency access is unavailable; public build remains required and private integration checks are skipped."
          fi

  private_test:
    name: Private ${{ matrix.configuration }} tests and build (${{ matrix.label }})
    needs: [classify_changes, private_access]
    if: needs.classify_changes.outputs.product_change == 'true' && needs.private_access.outputs.available == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: free-combination-actions
            variant: apple-silicon
            label: Apple Silicon
            triple: arm64-apple-macosx14.0
          - configuration: free-combination-actions
            variant: intel
            label: Intel Ventura
            triple: x86_64-apple-macosx13.0
          - configuration: paid-button-profiles
            variant: apple-silicon
            label: Apple Silicon
            triple: arm64-apple-macosx14.0
          - configuration: paid-button-profiles
            variant: intel
            label: Intel Ventura
            triple: x86_64-apple-macosx13.0
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve versioned release dependencies
        id: release-dependencies
        run: ./scripts/verify-release-dependency-pins.sh resolve github-output

      - name: Check out private feature package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.release-dependencies.outputs.sayall_ai_repository }}
          ref: ${{ steps.release-dependencies.outputs.sayall_ai_commit }}
          path: .private-dependencies/sayall-ai
          ssh-key: ${{ secrets.SAYALL_AI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out private macOS feature packages
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.release-dependencies.outputs.sayall_private_platform_repository }}
          ref: ${{ steps.release-dependencies.outputs.sayall_private_platform_commit }}
          path: .private-dependencies/sayall-private-platform
          ssh-key: ${{ secrets.SAYALL_PRIVATE_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out shared Mac remote package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.release-dependencies.outputs.sayall_mac_remote_repository }}
          ref: ${{ steps.release-dependencies.outputs.sayall_mac_remote_commit }}
          path: .private-dependencies/sayall-mac-remote
          ssh-key: ${{ secrets.SAYALL_MAC_REMOTE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure private packages
        run: |
          {
            echo "SAYALL_AI_PACKAGE_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-ai"
            echo "SAYALL_COMBINATION_ACTIONS_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-private-platform/packages/macos-combination-actions"
            echo "SAYALL_MAC_REMOTE_PACKAGE_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-mac-remote"
          } >> "$GITHUB_ENV"

      - name: Run free combination actions integration tests
        if: matrix.configuration == 'free-combination-actions'
        env:
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ""
        run: swift test --disable-keychain --skip BuildSigningTests --scratch-path ".build-private-free/${{ matrix.variant }}"

      - name: Build free combination actions release configuration
        if: matrix.configuration == 'free-combination-actions'
        env:
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ""
        run: |
          swift build --disable-keychain \
            --scratch-path ".build-private-free/${{ matrix.variant }}" \
            -c release \
            --triple "${{ matrix.triple }}"

      - name: Run paid button profiles integration tests
        if: matrix.configuration == 'paid-button-profiles'
        env:
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ${{ github.workspace }}/.private-dependencies/sayall-private-platform/packages/macos-button-profiles
        run: swift test --disable-keychain --skip BuildSigningTests --scratch-path ".build-private-paid/${{ matrix.variant }}"

      - name: Build paid button profiles release configuration
        if: matrix.configuration == 'paid-button-profiles'
        env:
          SAYALL_BUTTON_PROFILES_PACKAGE_PATH: ${{ github.workspace }}/.private-dependencies/sayall-private-platform/packages/macos-button-profiles
        run: |
          swift build --disable-keychain \
            --scratch-path ".build-private-paid/${{ matrix.variant }}" \
            -c release \
            --triple "${{ matrix.triple }}"

  test:
    name: Swift tests and build (${{ matrix.label }})
    needs: [classify_changes, public_test, private_access, private_test, release_checks]
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        label: [Apple Silicon, Intel Ventura]
    steps:
      - name: Require every applicable macOS CI lane
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify_changes.result }}
          PUBLIC_RESULT: ${{ needs.public_test.result }}
          PRIVATE_ACCESS_RESULT: ${{ needs.private_access.result }}
          PRIVATE_TEST_RESULT: ${{ needs.private_test.result }}
          RELEASE_CHECKS_RESULT: ${{ needs.release_checks.result }}
          RELEASE_CHECKS_REQUIRED: ${{ needs.classify_changes.outputs.release_checks }}
          PRODUCT_CHANGE: ${{ needs.classify_changes.outputs.product_change }}
          PRIVATE_AVAILABLE: ${{ needs.private_access.outputs.available }}
        run: |
          test "$CLASSIFY_RESULT" = success
          test "$PUBLIC_RESULT" = success
          [[ "$PRODUCT_CHANGE" == true || "$PRODUCT_CHANGE" == false ]] || exit 1
          [[ "$RELEASE_CHECKS_REQUIRED" == true || "$RELEASE_CHECKS_REQUIRED" == false ]] || exit 1
          if [[ "$RELEASE_CHECKS_REQUIRED" == true ]]; then
            test "$RELEASE_CHECKS_RESULT" = success
          else
            test "$RELEASE_CHECKS_RESULT" = skipped
          fi
          if [[ "$PRODUCT_CHANGE" == true ]]; then
            test "$PRIVATE_ACCESS_RESULT" = success
            [[ "$PRIVATE_AVAILABLE" == true || "$PRIVATE_AVAILABLE" == false ]] || exit 1
            if [[ "$PRIVATE_AVAILABLE" == true ]]; then
              test "$PRIVATE_TEST_RESULT" = success
            else
              test "$PRIVATE_TEST_RESULT" = skipped
            fi
          else
            test "$PRIVATE_ACCESS_RESULT" = skipped
            test "$PRIVATE_TEST_RESULT" = skipped
          fi
