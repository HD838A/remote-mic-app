name: macOS CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: mac-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Swift tests and build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Check patch formatting
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..HEAD"
          fi

      - name: Enforce extracted repository boundaries
        run: ./scripts/check-repository-boundaries.sh

      - name: Run Swift tests
        run: swift test

      - name: Run core first-voice journey gate
        run: |
          swift test --filter VoiceInputDestinationCoordinatorTests
          swift test --filter CoreVoiceInputJourneyTests

      - name: Run project self-test
        run: ./scripts/test.sh

      - name: Build release configuration
        run: swift build -c release
