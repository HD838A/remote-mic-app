name: macOS CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: mac-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  classify_changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      release_metadata_only: ${{ steps.changes.outputs.release_metadata_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect documentation-only change
        id: changes
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "release_metadata_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_metadata_only=false
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
             ./scripts/verify-release-metadata-diff.sh \
               "$PR_BASE_SHA" "$PR_HEAD_SHA" "$PR_HEAD_REF" >/dev/null 2>&1; then
            release_metadata_only=true
          fi
          echo "release_metadata_only=$release_metadata_only" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            diff_range="${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before_sha="${{ github.event.before }}"
            if [[ -z "$before_sha" || "$before_sha" == "0000000000000000000000000000000000000000" ]]; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            diff_range="$before_sha..HEAD"
          fi

          docs_only=true
          changed_file_found=false
          while IFS= read -r changed_path; do
            [[ -z "$changed_path" ]] && continue
            changed_file_found=true
            case "$changed_path" in
              *.md|Screenshots/*) ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < <(git diff --name-only "$diff_range")

          if [[ "$changed_file_found" != "true" ]]; then
            docs_only=false
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  test:
    name: Swift tests and build (${{ matrix.label }})
    needs: classify_changes
    runs-on: ${{ needs.classify_changes.outputs.docs_only == 'true' && 'ubuntu-latest' || 'macos-15' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: apple-silicon
            label: Apple Silicon
            triple: arm64-apple-macosx14.0
          - variant: intel
            label: Intel Ventura
            triple: x86_64-apple-macosx13.0
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_VARIANT: ${{ matrix.variant }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out private feature package
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-ai
          ref: 01beeceac9c4091e7e8e122ad1e840ac5e5cee1c
          path: .private-dependencies/sayall-ai
          ssh-key: ${{ secrets.SAYALL_AI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out private macro package
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-macro-platform
          ref: 734f24be4f6ebeacadeaa41d9902bdf414807d06
          path: .private-dependencies/sayall-macro-platform
          ssh-key: ${{ secrets.SAYALL_MACRO_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure private feature package
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          echo "SAYALL_AI_PACKAGE_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-ai" >> "$GITHUB_ENV"
          echo "SAYALL_MACRO_PLATFORM_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-macro-platform" >> "$GITHUB_ENV"

      - name: Check out shared Mac remote package
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/checkout@v5
        with:
          repository: GetSayAll/sayall-mac-remote
          ref: 3f3c782180eef4024b53941c1f65d80e7cff4c66
          path: .private-dependencies/sayall-mac-remote
          ssh-key: ${{ secrets.SAYALL_MAC_REMOTE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Configure shared Mac remote package
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: swift package config set-mirror --original https://github.com/GetSayAll/sayall-mac-remote.git --mirror "file://$GITHUB_WORKSPACE/.private-dependencies/sayall-mac-remote"

      - name: Show toolchain
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true'
        run: swift --version

      - name: Check patch formatting
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check "${{ github.event.before }}..HEAD"
          fi

      - name: Confirm documentation-only fast path
        if: needs.classify_changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; skipping private dependencies, Swift tests, and macOS builds."

      - name: Reuse exact parent main CI for release metadata
        if: needs.classify_changes.outputs.release_metadata_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.head_ref }}
        run: |
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
          ./scripts/verify-preview-branch.sh
          ./scripts/verify-release-dependency-pins.sh
          ./scripts/verify-release-ready-main-ci.sh "${{ github.event.pull_request.base.sha }}"
          echo "Release metadata-only PR; exact parent main already passed both architecture lanes."

      - name: Enforce extracted repository boundaries
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true'
        run: ./scripts/check-repository-boundaries.sh

      - name: Verify release dependency pins stay aligned
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true'
        run: ./scripts/verify-release-dependency-pins.sh

      - name: Run Swift tests
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true'
        run: swift test

      - name: Run core first-voice journey gate
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true'
        run: |
          swift test --filter VoiceInputDestinationCoordinatorTests
          swift test --filter CoreVoiceInputJourneyTests

      - name: Run project self-test
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true'
        run: SKIP_SWIFT_PACKAGE_BUILD=1 ./scripts/test.sh

      - name: Build release configuration
        if: needs.classify_changes.outputs.docs_only != 'true' && needs.classify_changes.outputs.release_metadata_only != 'true'
        run: swift build -c release --triple "${{ matrix.triple }}"
