name: macOS Signed Release Packages
run-name: mac-release ${{ inputs.release_mode }} ${{ inputs.tag }} ${{ inputs.request_id || inputs.expected_pipeline_digest }} ${{ inputs.expected_commit }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching Resources/Info.plist, for example v1.8.13
        required: true
        type: string
      release_mode:
        description: Qualify a changed release pipeline, publish a preview candidate, or recover a failed preview publication
        required: true
        default: qualification
        type: choice
        options:
          - qualification
          - preview
          - resume-preview
      expected_commit:
        description: Required exact 40-character source commit
        required: true
        type: string
      expected_pipeline_digest:
        description: Required qualified release pipeline SHA-256 digest
        required: true
        type: string
      request_started_at:
        description: Unix epoch seconds when the user requested this preview release
        required: false
        type: string
      request_id:
        description: Immutable release-manager request identifier, reused unchanged on retry
        required: false
        type: string
      source_run_id:
        description: Exact failed preview Run to recover without re-signing
        required: false
        type: string
      source_run_attempt:
        description: Exact attempt number of the failed preview Run
        required: false
        type: string
      source_artifact_id:
        description: Exact signed artifact ID produced by the failed preview Run
        required: false
        type: string
      source_artifact_digest:
        description: API SHA-256 digest of the exact signed artifact
        required: false
        type: string

concurrency:
  # Preview locks its external Tag; qualification locks the reviewed pipeline digest.
  group: ${{ inputs.release_mode == 'qualification' && format('mac-release-qualification-{0}', inputs.expected_pipeline_digest) || format('mac-signed-tag-{0}', inputs.tag) }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  EXPECTED_STABLE_TAG: v1.8.3

jobs:
  preview-slo-watchdog:
    name: Enforce 30-minute release-ready preview SLO
    if: ${{ inputs.release_mode == 'preview' }}
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
    steps:
      - name: Download immutable request attestation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-request-attestation-${{ inputs.tag }}-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/release-request

      - name: Cancel an over-budget release once, without retrying
        env:
          GH_TOKEN: ${{ github.token }}
          READY_SLO_SECONDS: 1740
        run: |
          attestation="$RUNNER_TEMP/release-request/release-request-attestation.json"
          request_started_at="$(jq -r '.requestStartedAt' "$attestation")"
          release_ready_at="$(jq -r '.releaseReadyAt' "$attestation")"
          if [[ ! "$request_started_at" =~ ^[0-9]+$ ||
                ! "$release_ready_at" =~ ^[0-9]+$ ||
                "$release_ready_at" -lt "$request_started_at" ]]; then
            echo "immutable release timestamps are invalid" >&2
            exit 2
          fi
          while true; do
            now="$(date +%s)"
            total_elapsed=$(( now - request_started_at ))
            ready_elapsed=$(( now - release_ready_at ))
            artifact_count="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=release-slo-ledger-published-$GITHUB_RUN_ID" \
              --jq '.total_count')"
            if [[ "$artifact_count" == "1" ]]; then
              echo "PREVIEW SLO WATCHDOG PASS total=${total_elapsed}s ready=${ready_elapsed}s"
              exit 0
            fi
            failed_jobs="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=latest" \
              --jq '[.jobs[] | select(.name != "Enforce 30-minute release-ready preview SLO" and .conclusion != null and .conclusion != "success" and .conclusion != "skipped")] | length')"
            if (( failed_jobs != 0 )); then
              echo "A release job already failed; watchdog will not retry it."
              exit 0
            fi
            if (( ready_elapsed >= READY_SLO_SECONDS )); then
              echo "PREVIEW SLO EXCEEDED total=${total_elapsed}s(reported-only) ready=${ready_elapsed}s/${READY_SLO_SECONDS}s; cancelling run once." >&2
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"
              exit 124
            fi
            sleep 10
          done

  validate-candidate:
    if: ${{ inputs.release_mode != 'resume-preview' }}
    name: Verify exact preview candidate CI and Draft recording PR
    runs-on: macos-15
    timeout-minutes: 10
    outputs:
      preview_release_action: ${{ steps.preview-publication-state.outputs.action }}

    steps:
      - name: Validate immutable dispatch inputs before checkout
        env:
          RELEASE_MODE: ${{ inputs.release_mode }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
          REQUEST_STARTED_AT: ${{ inputs.request_started_at }}
          REQUEST_ID: ${{ inputs.request_id }}
          TRIGGER_COMMIT: ${{ github.sha }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          TRIGGER_REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$RELEASE_MODE" in
            qualification|preview) ;;
            *) echo "release_mode must be qualification or preview" >&2; exit 2 ;;
          esac
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PIPELINE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$TRIGGER_COMMIT" = "$EXPECTED_COMMIT"
          test "$TRIGGER_REF_TYPE" = "branch"
          if [[ "$RELEASE_MODE" == "qualification" ]]; then
            [[ "$TRIGGER_REF_NAME" =~ ^release/pipeline-qualification/[a-z0-9][a-z0-9._-]*$ ]]
            if [[ -n "$REQUEST_STARTED_AT" ]]; then
              [[ "$REQUEST_STARTED_AT" =~ ^[0-9]+$ ]]
            fi
          else
            test "$TRIGGER_REF_NAME" = "release/pre-$RELEASE_TAG"
            [[ "$REQUEST_STARTED_AT" =~ ^[0-9]+$ ]]
            [[ "$REQUEST_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$ ]]
          fi

      - name: Check out release candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Initialize user-wall release ledger
        env:
          REQUEST_STARTED_AT_INPUT: ${{ inputs.request_started_at }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          request_started_at="$REQUEST_STARTED_AT_INPUT"
          if [[ "$RELEASE_MODE" == "qualification" && -z "$request_started_at" ]]; then
            request_started_at="$(date +%s)"
          fi
          if [[ ! "$request_started_at" =~ ^[0-9]+$ ]]; then
            echo "A real preview requires request_started_at." >&2
            exit 2
          fi
          {
            echo "RELEASE_REQUEST_STARTED_AT=$request_started_at"
            echo "RELEASE_SLO_LEDGER=$RUNNER_TEMP/release-slo.tsv"
          } >> "$GITHUB_ENV"
          ./scripts/release-slo-ledger.sh init "$RUNNER_TEMP/release-slo.tsv" "$request_started_at"
          ./scripts/release-slo-ledger.sh start "$RUNNER_TEMP/release-slo.tsv" "$request_started_at" candidate-gates

      - name: Install required validation tools
        run: |
          command -v jq >/dev/null || brew install jq
          command -v rg >/dev/null || brew install ripgrep

      - name: Verify exact candidate or pipeline qualification provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_PREVIEW_RECORDING_PR: 1
          RELEASE_READY_PROOF_OUTPUT: ${{ runner.temp }}/release-ready-main-ci.json
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
        run: |
          if [[ "$RELEASE_MODE" == "qualification" ]]; then
            ./scripts/verify-release-pipeline-qualification-source.sh
          else
            [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_PIPELINE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
            test "$(./scripts/release-pipeline-digest.sh)" = "$EXPECTED_PIPELINE_DIGEST"
            ./scripts/verify-release-timeout-budgets.sh
            ./scripts/verify-preview-candidate-ci.sh
            ./scripts/verify-release-pipeline-qualification.sh "$EXPECTED_PIPELINE_DIGEST"
          fi

      - name: Resolve immutable request attestation
        if: ${{ inputs.release_mode == 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          ./scripts/resolve-release-request-attestation.sh \
            "$RELEASE_REQUEST_ID" "$RELEASE_TAG" "$RELEASE_REQUEST_STARTED_AT" \
            "$(git rev-parse HEAD)" "$RUNNER_TEMP/release-ready-main-ci.json" \
            "$RUNNER_TEMP/release-request-attestation.json"

      - name: Resolve existing Preview publication state
        id: preview-publication-state
        if: ${{ inputs.release_mode == 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
          RELEASE_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          expected_branch="release/pre-$RELEASE_TAG"
          release_endpoint="repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG"
          response_file="$RUNNER_TEMP/existing-preview-response.txt"
          release_json="$RUNNER_TEMP/existing-preview-release.json"

          actual_stable_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          if [[ "$actual_stable_tag" != "$EXPECTED_STABLE_TAG" ]]; then
            echo "Preview requires stable latest $EXPECTED_STABLE_TAG; found $actual_stable_tag" >&2
            exit 1
          fi

          set +e
          gh api --include "$release_endpoint" > "$response_file"
          api_status="$?"
          set -e
          http_code="$(/usr/bin/awk '$1 ~ /^HTTP\// { code = $2 } END { print code }' "$response_file")"
          case "$http_code" in
            404)
              if [[ "$api_status" == "0" ]]; then
                echo "GitHub returned an inconsistent not-found response for $RELEASE_TAG" >&2
                exit 1
              fi
              echo "action=package" >> "$GITHUB_OUTPUT"
              echo "No existing GitHub Release for $RELEASE_TAG; protected packaging is required."
              exit 0
              ;;
            200)
              if [[ "$api_status" != "0" ]]; then
                echo "GitHub returned HTTP 200 with a failing CLI status for $RELEASE_TAG" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unable to determine existing Release state for $RELEASE_TAG (HTTP ${http_code:-unknown}, gh=$api_status)" >&2
              exit 1
              ;;
          esac

          gh api "$release_endpoint" > "$release_json"
          jq -e \
            --arg tag "$RELEASE_TAG" \
            '(.tag_name == $tag) and
             (.draft == false) and
             (.prerelease == true) and
             ([.assets[] | select(.name == "candidate-provenance.json")] | length == 1)' \
            "$release_json" >/dev/null || {
              echo "Existing $RELEASE_TAG is not one exact non-draft Pre-release with candidate provenance" >&2
              exit 1
            }

          branch_head="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$expected_branch" \
            --jq '.object.sha')"
          if [[ "$branch_head" != "$EXPECTED_COMMIT" ]]; then
            echo "Existing Preview branch no longer points to the expected candidate commit" >&2
            exit 1
          fi

          tag_object="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" \
            --jq '.object | [.type, .sha] | @tsv')"
          IFS=$'\t' read -r tag_type tag_sha <<< "$tag_object"
          for _ in 1 2 3 4; do
            [[ "$tag_type" == "tag" ]] || break
            tag_object="$(gh api \
              "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" \
              --jq '.object | [.type, .sha] | @tsv')"
            IFS=$'\t' read -r tag_type tag_sha <<< "$tag_object"
          done
          if [[ "$tag_type" != "commit" || "$tag_sha" != "$EXPECTED_COMMIT" ]]; then
            echo "Existing Preview tag does not resolve to the expected candidate commit" >&2
            exit 1
          fi

          provenance_dir="$RUNNER_TEMP/existing-preview-provenance"
          /bin/mkdir -p "$provenance_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern candidate-provenance.json \
            --dir "$provenance_dir"
          provenance="$provenance_dir/candidate-provenance.json"
          test -f "$provenance"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg branch "$expected_branch" \
            --arg version "${RELEASE_TAG#v}" \
            --arg requestId "$RELEASE_REQUEST_ID" \
            --arg pipelineDigest "$EXPECTED_PIPELINE_DIGEST" \
            --slurpfile requestAttestation "$RUNNER_TEMP/release-request-attestation.json" \
            '(.schemaVersion == 2 or .schemaVersion == 3) and
             (.repository == $repository) and
             (.tag == $tag) and
             (.tagCommit == $commit) and
             (.candidateBranch == $branch) and
             (.version == $version) and
             (.build | type == "string" and test("^[0-9]+$")) and
             (.baseMainCommit | type == "string" and test("^[0-9a-f]{40}$")) and
             (.payloadAssets | type == "array" and length > 0) and
             ([.payloadAssets[].name] | length == (unique | length)) and
             all(.payloadAssets[];
               (.name | type == "string" and length > 0 and test("^[A-Za-z0-9][A-Za-z0-9._-]*$") and
                 . != "candidate-provenance.json" and
                 . != "stable-promotion.json") and
               (.size | type == "number" and . >= 0 and floor == .) and
               (.sha256 | type == "string" and test("^[0-9a-f]{64}$"))) and
             (if .schemaVersion == 3 then
                .requestId == $requestId and
                .attemptId == $commit and
                .requestId == $requestAttestation[0].requestId and
                .attemptId == $requestAttestation[0].attemptId and
                .requestStartedAt == $requestAttestation[0].requestStartedAt and
                .releaseReadyAt == $requestAttestation[0].releaseReadyAt and
                .pipelineDigest == $pipelineDigest and
                .pipelineDigest == $requestAttestation[0].pipelineDigest and
                .pipelineQualifiedAt == $requestAttestation[0].pipelineQualifiedAt and
                .pipelineQualificationRunId == $requestAttestation[0].pipelineQualificationRunId and
                .pipelineQualificationArtifactId == $requestAttestation[0].pipelineQualificationArtifactId and
                .pipelineQualificationArtifactDigest == $requestAttestation[0].pipelineQualificationArtifactDigest and
                (.requestAttestationRunId | type == "number" and . > 0) and
                (.requestAttestationRunAttempt | type == "number" and . > 0)
              else true end)' \
            "$provenance" >/dev/null || {
              echo "Existing Preview provenance is not bound to the requested branch, commit, and version" >&2
              exit 1
            }

          echo "action=verify-only" >> "$GITHUB_OUTPUT"
          echo "Existing exact Pre-release found; protected packaging will be skipped and public bytes verified in place."

      - name: Persist first request timestamps
        if: ${{ inputs.release_mode == 'preview' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-request-attestation-${{ inputs.tag }}-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/release-request-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Record candidate gates and approval wait
        if: always()
        run: |
          result="${{ job.status }}"
          ./scripts/release-slo-ledger.sh finish "$RELEASE_SLO_LEDGER" "$RELEASE_REQUEST_STARTED_AT" candidate-gates "$result"
          if [[ "$result" == "success" ]]; then
            ./scripts/release-slo-ledger.sh start "$RELEASE_SLO_LEDGER" "$RELEASE_REQUEST_STARTED_AT" environment-approval-and-runner-wait
          fi

      - name: Upload release ledger handoff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slo-ledger-${{ github.run_id }}
          path: ${{ env.RELEASE_SLO_LEDGER }}
          if-no-files-found: error
          retention-days: 14

  package:
    name: Sign and notarize Apple Silicon and Intel packages
    needs: validate-candidate
    if: ${{ inputs.release_mode == 'qualification' || needs.validate-candidate.outputs.preview_release_action == 'package' }}
    runs-on: macos-15
    timeout-minutes: 180
    environment: mac-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_DEVELOPER_TEAM_ID: L3QHLDRPAY
      PARALLEL_RELEASE_VARIANTS: 1
      PARALLEL_PACKAGE_NOTARIZATION: 1
      RELEASE_STAGE_TIMEOUTS: 1
      SIGNED_RELEASE_TIMEOUT_SECONDS: 540
      PREVIEW_READY_SLO_SECONDS: 1740
      RELEASE_MODE: ${{ inputs.release_mode }}

    steps:
      - name: Verify protected dispatch identity before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE_INPUT: ${{ inputs.release_mode }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          EXPECTED_COMMIT_INPUT: ${{ inputs.expected_commit }}
          EXPECTED_PIPELINE_DIGEST_INPUT: ${{ inputs.expected_pipeline_digest }}
          REQUEST_STARTED_AT_INPUT: ${{ inputs.request_started_at }}
          REQUEST_ID_INPUT: ${{ inputs.request_id }}
          TRIGGER_COMMIT: ${{ github.sha }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
          TRIGGER_REF_TYPE: ${{ github.ref_type }}
        run: |
          case "$RELEASE_MODE_INPUT" in
            qualification|preview) ;;
            *) echo "release_mode must be qualification or preview" >&2; exit 2 ;;
          esac
          [[ "$RELEASE_TAG_INPUT" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EXPECTED_COMMIT_INPUT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PIPELINE_DIGEST_INPUT" =~ ^[0-9a-f]{64}$ ]]
          test "$TRIGGER_COMMIT" = "$EXPECTED_COMMIT_INPUT"
          test "$TRIGGER_REF_TYPE" = "branch"
          if [[ "$RELEASE_MODE_INPUT" == "qualification" ]]; then
            [[ "$TRIGGER_REF_NAME" =~ ^release/pipeline-qualification/[a-z0-9][a-z0-9._-]*$ ]]
            if [[ -n "$REQUEST_STARTED_AT_INPUT" ]]; then
              [[ "$REQUEST_STARTED_AT_INPUT" =~ ^[0-9]+$ ]]
            fi
          else
            test "$TRIGGER_REF_NAME" = "release/pre-$RELEASE_TAG_INPUT"
            [[ "$REQUEST_STARTED_AT_INPUT" =~ ^[0-9]+$ ]]
            [[ "$REQUEST_ID_INPUT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{7,63}$ ]]
          fi
          remote_head="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$TRIGGER_REF_NAME" \
            --jq '.object.sha')"
          test "$remote_head" = "$EXPECTED_COMMIT_INPUT"

      - name: Check out release candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}
          persist-credentials: false

      - name: Verify checked-out source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          git diff --quiet
          git diff --cached --quiet

      - name: Download release ledger handoff
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-slo-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/release-slo

      - name: Download immutable request attestation
        if: ${{ inputs.release_mode == 'preview' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-request-attestation-${{ inputs.tag }}-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/release-request

      - name: Enforce preview user-wall budget before credentials
        env:
          REQUEST_STARTED_AT_INPUT: ${{ inputs.request_started_at }}
        run: |
          request_started_at="$REQUEST_STARTED_AT_INPUT"
          if [[ "$RELEASE_MODE" == "qualification" ]]; then
            if [[ -z "$request_started_at" ]]; then
              request_started_at="$(date +%s)"
            fi
            release_ready_at="$request_started_at"
          else
            attestation="$RUNNER_TEMP/release-request/release-request-attestation.json"
            request_started_at="$(jq -r '.requestStartedAt' "$attestation")"
            release_ready_at="$(jq -r '.releaseReadyAt' "$attestation")"
          fi
          ledger="$RUNNER_TEMP/release-slo/release-slo.tsv"
          {
            echo "RELEASE_REQUEST_STARTED_AT=$request_started_at"
            echo "RELEASE_READY_AT=$release_ready_at"
            echo "RELEASE_SLO_LEDGER=$ledger"
          } >> "$GITHUB_ENV"
          ./scripts/release-slo-ledger.sh finish "$ledger" "$request_started_at" environment-approval-and-runner-wait success external-approval-wait
          ./scripts/release-slo-ledger.sh check "$ledger" "$release_ready_at" "$PREVIEW_READY_SLO_SECONDS" external-approval-wait
          ./scripts/release-slo-ledger.sh start "$ledger" "$request_started_at" signed-build-notarization

      - name: Verify active source before protected credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          if [[ "$RELEASE_MODE" == "qualification" ]]; then
            ./scripts/verify-release-pipeline-qualification-source.sh
          else
            base_sha="$(git rev-parse HEAD^)"
            trusted_runner="$RUNNER_TEMP/run-trusted-release-validation.sh"
            git show "${base_sha}:scripts/run-trusted-release-validation.sh" > "$trusted_runner"
            chmod 755 "$trusted_runner"
            REPOSITORY_ROOT="$GITHUB_WORKSPACE" ALLOW_FROZEN_BASE_MAIN=1 \
              "$trusted_runner"
          fi

      - name: Install and record qualified release toolchain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing_formulae=()
          command -v age >/dev/null || missing_formulae+=(age)
          command -v fastlane >/dev/null || missing_formulae+=(fastlane)
          command -v rg >/dev/null || missing_formulae+=(ripgrep)
          if (( ${#missing_formulae[@]} != 0 )); then
            brew install "${missing_formulae[@]}"
          fi

          age_version="$(age --version 2>&1 | /usr/bin/sed -n '1p')"
          fastlane_version="$(fastlane --version 2>&1 | /usr/bin/awk '/^fastlane [0-9]/{ print $2; exit }')"
          xcode_version="$(xcodebuild -version | /usr/bin/awk 'NR == 1 { print $2 }')"
          xcode_build="$(xcodebuild -version | /usr/bin/awk 'NR == 2 { print $3 }')"
          jq_version="$(jq --version)"
          ripgrep_version="$(rg --version | /usr/bin/awk 'NR == 1 { print $2 }')"
          gh_version="$(gh --version | /usr/bin/awk 'NR == 1 { print $3 }')"
          git_version="$(git --version)"
          swift_version="$(swift --version 2>&1 | /usr/bin/sed -n '1p')"
          toolchain_file="$RUNNER_TEMP/release-toolchain.json"
          jq -n \
            --arg ageVersion "$age_version" \
            --arg fastlaneVersion "$fastlane_version" \
            --arg xcodeVersion "$xcode_version" \
            --arg xcodeBuild "$xcode_build" \
            --arg imageOS "${ImageOS:-}" \
            --arg imageVersion "${ImageVersion:-}" \
            --arg jqVersion "$jq_version" \
            --arg ripgrepVersion "$ripgrep_version" \
            --arg ghVersion "$gh_version" \
            --arg gitVersion "$git_version" \
            --arg swiftVersion "$swift_version" \
            '{
              ageVersion: $ageVersion,
              fastlaneVersion: $fastlaneVersion,
              xcodeVersion: $xcodeVersion,
              xcodeBuild: $xcodeBuild,
              imageOS: $imageOS,
              imageVersion: $imageVersion,
              jqVersion: $jqVersion,
              ripgrepVersion: $ripgrepVersion,
              ghVersion: $ghVersion,
              gitVersion: $gitVersion,
              swiftVersion: $swiftVersion,
              externalDependencies: {
                actionsCheckoutCommit: "fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09",
                actionsDownloadArtifactCommit: "634f93cb2916e3fdff6788551b99b062d0335ce0",
                actionsUploadArtifactCommit: "ea165f8d65b6e75b540449e92b4886f43607fa02",
                notarySecretsCommit: "5baaeaf56f6cd5fbd0fb0e08c9290077ba8b5b5d",
                matchCommit: "2e271768593821611c54f3d1b376f39e503f53be",
                sayAllAICommit: "01beeceac9c4091e7e8e122ad1e840ac5e5cee1c",
                sayAllMacroPlatformCommit: "b71482ccb3c5d3be319abe7cd61915ab90cbc3ba",
                sayAllMacRemoteCommit: "3f3c782180eef4024b53941c1f65d80e7cff4c66"
              }
            }' > "$toolchain_file"
          jq -e '
            ([.ageVersion, .fastlaneVersion, .xcodeVersion, .xcodeBuild,
              .imageOS, .imageVersion, .jqVersion, .ripgrepVersion,
              .ghVersion, .gitVersion, .swiftVersion] |
              all(.[]; type == "string" and length > 0)) and
            (.externalDependencies | type == "object" and length == 8 and
              ([.[]] | all(.[]; test("^[0-9a-f]{40}$"))))
          ' "$toolchain_file" >/dev/null
          echo "RELEASE_TOOLCHAIN_ATTESTATION=$toolchain_file" >> "$GITHUB_ENV"
          jq . "$toolchain_file"

      - name: Match qualified release toolchain exactly
        if: ${{ inputs.release_mode == 'preview' }}
        run: |
          request_attestation="$RUNNER_TEMP/release-request/release-request-attestation.json"
          test -r "$request_attestation"
          actual_toolchain="$(jq -S -c . "$RELEASE_TOOLCHAIN_ATTESTATION")"
          qualified_toolchain="$(jq -S -c '{
            ageVersion,
            fastlaneVersion,
            xcodeVersion,
            xcodeBuild,
            imageOS,
            imageVersion,
            jqVersion,
            ripgrepVersion,
            ghVersion,
            gitVersion,
            swiftVersion,
            externalDependencies
          }' "$request_attestation")"
          if [[ "$actual_toolchain" != "$qualified_toolchain" ]]; then
            echo "Current release toolchain does not exactly match the protected qualification." >&2
            exit 1
          fi

      - name: Reconfirm active protected ref before private secrets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          TRIGGER_REF_NAME: ${{ github.ref_name }}
        run: |
          remote_head="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$TRIGGER_REF_NAME" \
            --jq '.object.sha')"
          test "$remote_head" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Check out private feature package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: GetSayAll/sayall-ai
          ref: 01beeceac9c4091e7e8e122ad1e840ac5e5cee1c
          path: .private-dependencies/sayall-ai
          ssh-key: ${{ secrets.SAYALL_AI_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out private macro package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: GetSayAll/sayall-macro-platform
          ref: b71482ccb3c5d3be319abe7cd61915ab90cbc3ba
          path: .private-dependencies/sayall-macro-platform
          ssh-key: ${{ secrets.SAYALL_MACRO_PLATFORM_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out shared Mac remote package
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: GetSayAll/sayall-mac-remote
          ref: 3f3c782180eef4024b53941c1f65d80e7cff4c66
          path: .private-dependencies/sayall-mac-remote
          ssh-key: ${{ secrets.SAYALL_MAC_REMOTE_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out readonly release credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: HD838A/remotemic-notary-secrets
          ref: 5baaeaf56f6cd5fbd0fb0e08c9290077ba8b5b5d
          path: .private-release/remotemic-notary-secrets
          ssh-key: ${{ secrets.RELEASE_CREDENTIALS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Check out readonly Match signing identities
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: HD838A/apple-signing-match
          ref: 2e271768593821611c54f3d1b376f39e503f53be
          path: .private-release/apple-signing-match
          ssh-key: ${{ secrets.APPLE_SIGNING_MATCH_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify immutable private dependency checkouts
        run: |
          test "$(git -C .private-dependencies/sayall-ai rev-parse HEAD)" = "01beeceac9c4091e7e8e122ad1e840ac5e5cee1c"
          test "$(git -C .private-dependencies/sayall-macro-platform rev-parse HEAD)" = "b71482ccb3c5d3be319abe7cd61915ab90cbc3ba"
          test "$(git -C .private-dependencies/sayall-mac-remote rev-parse HEAD)" = "3f3c782180eef4024b53941c1f65d80e7cff4c66"
          test "$(git -C .private-release/remotemic-notary-secrets rev-parse HEAD)" = "5baaeaf56f6cd5fbd0fb0e08c9290077ba8b5b5d"
          match_repo="$GITHUB_WORKSPACE/.private-release/apple-signing-match"
          match_commit="2e271768593821611c54f3d1b376f39e503f53be"
          test "$(git -C "$match_repo" rev-parse HEAD)" = "$match_commit"

          # Match clones this checkout again via file:// with git_branch=main.
          # An exact-SHA checkout is detached, so expose only that verified commit
          # as local main instead of letting Fastlane create an empty orphan branch.
          git -C "$match_repo" update-ref refs/heads/main "$match_commit"
          test "$(git -C "$match_repo" rev-parse refs/heads/main)" = "$match_commit"
          test "$(git ls-remote "file://$match_repo" refs/heads/main | /usr/bin/awk 'NR == 1 { print $1 }')" = "$match_commit"

      - name: Configure private feature package
        run: |
          {
            echo "SAYALL_AI_PACKAGE_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-ai"
            echo "SAYALL_MACRO_PLATFORM_PATH=$GITHUB_WORKSPACE/.private-dependencies/sayall-macro-platform"
            echo "REQUIRE_SAYALL_AI_PACKAGE=1"
            echo "REQUIRE_SAYALL_MACRO_PLATFORM=1"
          } >> "$GITHUB_ENV"
          swift package config set-mirror --original https://github.com/GetSayAll/sayall-mac-remote.git --mirror "file://$GITHUB_WORKSPACE/.private-dependencies/sayall-mac-remote"

      - name: Prepare protected release identity
        env:
          RELEASE_AGE_IDENTITY: ${{ secrets.RELEASE_AGE_IDENTITY }}
        run: |
          test -n "$RELEASE_AGE_IDENTITY"
          release_identity="$RUNNER_TEMP/remotemic-release.agekey"
          umask 077
          printf '%s' "$RELEASE_AGE_IDENTITY" > "$release_identity"
          chmod 600 "$release_identity"
          {
            echo "AGE_IDENTITY_FILE=$release_identity"
            echo "RELEASE_CREDENTIALS_REPO=$GITHUB_WORKSPACE/.private-release/remotemic-notary-secrets"
            echo "MATCH_REPO=$GITHUB_WORKSPACE/.private-release/apple-signing-match"
          } >> "$GITHUB_ENV"

      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
        run: |
          if [[ "$RELEASE_MODE" == "qualification" ]]; then
            ./scripts/verify-release-pipeline-qualification-source.sh
          else
            version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
            test "$RELEASE_TAG" = "v$version"
            test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
            base_sha="$(git rev-parse HEAD^)"
            trusted_runner="$RUNNER_TEMP/run-trusted-release-validation.sh"
            git show "${base_sha}:scripts/run-trusted-release-validation.sh" > "$trusted_runner"
            chmod 755 "$trusted_runner"
            REPOSITORY_ROOT="$GITHUB_WORKSPACE" ALLOW_FROZEN_BASE_MAIN=1 "$trusted_runner"
          fi

      - name: Compute remaining signed-build budget
        if: ${{ inputs.release_mode == 'preview' }}
        run: |
          now="$(date +%s)"
          remaining=$(( PREVIEW_READY_SLO_SECONDS - (now - RELEASE_READY_AT) - 45 ))
          if (( remaining <= 0 )); then
            echo "No release-ready budget remains for signed packaging and artifact upload." >&2
            exit 124
          fi
          if (( remaining < SIGNED_RELEASE_TIMEOUT_SECONDS )); then
            echo "SIGNED_RELEASE_TIMEOUT_SECONDS=$remaining" >> "$GITHUB_ENV"
          fi
          echo "SIGNED RELEASE REMAINING BUDGET: ${remaining}s"

      - name: Sign, notarize, staple, and verify both variants
        timeout-minutes: 10
        env:
          REMOTE_WEB_RELAY_URL: ${{ secrets.REMOTE_WEB_RELAY_URL }}
          EARLY_ACCESS_SERVICE_URL: ${{ secrets.EARLY_ACCESS_SERVICE_URL }}
        run: |
          ./scripts/run-release-stage.sh \
            all signed-release "$SIGNED_RELEASE_TIMEOUT_SECONDS" -- \
            ./scripts/package-macos-release-in-actions.sh

      - name: Record signed package SLO
        if: always()
        run: |
          result="${{ job.status }}"
          ./scripts/release-slo-ledger.sh finish "$RELEASE_SLO_LEDGER" "$RELEASE_REQUEST_STARTED_AT" signed-build-notarization "$result"
          if [[ "$result" == "success" && "$RELEASE_MODE" == "preview" ]]; then
            ./scripts/release-slo-ledger.sh check "$RELEASE_SLO_LEDGER" "$RELEASE_READY_AT" "$PREVIEW_READY_SLO_SECONDS" successful-pipeline
          fi

      - name: Verify active preview before signed artifact handoff
        if: ${{ inputs.release_mode == 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          base_sha="$(git rev-parse HEAD^)"
          trusted_runner="$RUNNER_TEMP/run-trusted-release-validation.sh"
          git show "${base_sha}:scripts/run-trusted-release-validation.sh" > "$trusted_runner"
          chmod 755 "$trusted_runner"
          REPOSITORY_ROOT="$GITHUB_WORKSPACE" ALLOW_FROZEN_BASE_MAIN=1 \
            "$trusted_runner"

      - name: Upload signed release packages
        if: ${{ inputs.release_mode == 'preview' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: remote-mic-${{ inputs.tag }}-signed-macos
          path: |
            dist/Remote-Mic-*.dmg
            dist/Remote-Mic-*.dmg.sha256
            dist/Remote-Mic-*.zip
            dist/Remote-Mic-*.txt
            dist/Uninstall Remote Mic.pkg
            dist/appcast.xml
            dist/intel/Remote-Mic-*-Intel.dmg
            dist/intel/Remote-Mic-*-Intel.dmg.sha256
            dist/intel/Remote-Mic-*-Intel.zip
            dist/intel/Uninstall Remote Mic Intel.pkg
            dist/intel/appcast-intel.xml
          if-no-files-found: error
          retention-days: 14

      - name: Record protected release pipeline qualification
        if: ${{ inputs.release_mode == 'qualification' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
        run: |
          ./scripts/verify-release-pipeline-qualification-source.sh
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_commit }}"
          test "$(./scripts/release-pipeline-digest.sh)" = "${{ inputs.expected_pipeline_digest }}"
          source_pr="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/${{ inputs.expected_commit }}/pulls" \
            --header 'Accept: application/vnd.github+json' \
            --jq "[.[] | select(.state == \"open\" and .base.ref == \"main\" and .head.sha == \"${{ inputs.expected_commit }}\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\") | .number] | if length == 1 then .[0] else empty end")"
          [[ "$source_pr" =~ ^[1-9][0-9]*$ ]]
          qualification_dir="$RUNNER_TEMP/release-pipeline-qualification"
          /bin/mkdir -p "$qualification_dir"
          jq -n \
            --arg pipelineDigest "${{ inputs.expected_pipeline_digest }}" \
            --arg sourceCommit "${{ inputs.expected_commit }}" \
            --arg sourceBranch "$GITHUB_REF_NAME" \
            --argjson sourcePullRequest "$source_pr" \
            --argjson workflowRunId "$GITHUB_RUN_ID" \
            --argjson workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg qualifiedAt "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --arg expectedTeamId "$EXPECTED_DEVELOPER_TEAM_ID" \
            --slurpfile releaseToolchain "$RELEASE_TOOLCHAIN_ATTESTATION" \
            '{schemaVersion:2,pipelineDigest:$pipelineDigest,sourceCommit:$sourceCommit,sourceBranch:$sourceBranch,sourcePullRequest:$sourcePullRequest,workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt,qualifiedAt:$qualifiedAt,expectedTeamId:$expectedTeamId} + $releaseToolchain[0]' \
            > "$qualification_dir/release-pipeline-qualification.json"
          echo "PROTECTED RELEASE PIPELINE QUALIFICATION PASS"
          echo "No Tag, GitHub Release, appcast, or distributable App asset was created."

      - name: Upload protected release pipeline qualification
        if: ${{ inputs.release_mode == 'qualification' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-release-pipeline-qualification-${{ inputs.expected_pipeline_digest }}
          path: ${{ runner.temp }}/release-pipeline-qualification/release-pipeline-qualification.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload final release stage ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slo-ledger-final-${{ github.run_id }}
          path: ${{ env.RELEASE_SLO_LEDGER }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish and verify exact signed preview bytes
    if: ${{ always() && inputs.release_mode == 'preview' && needs.validate-candidate.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && needs.validate-candidate.outputs.preview_release_action == 'verify-only')) }}
    needs:
      - validate-candidate
      - package
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
      PREVIEW_RELEASE_ACTION: ${{ needs.validate-candidate.outputs.preview_release_action }}
      RELEASE_REQUEST_STARTED_AT: ${{ inputs.request_started_at }}
      RELEASE_REQUEST_ID: ${{ inputs.request_id }}
      ALLOW_FROZEN_BASE_MAIN: 1
      PREVIEW_READY_SLO_SECONDS: 1740
      PUBLICATION_MAX_SECONDS: 180
      EXPECTED_DEVELOPER_TEAM_ID: L3QHLDRPAY
      PUBLIC_DOWNLOAD_CONCURRENCY: 4
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_commit }}

      - name: Download exact signed package artifact
        if: ${{ needs.validate-candidate.outputs.preview_release_action == 'package' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: remote-mic-${{ inputs.tag }}-signed-macos
          path: dist

      - name: Download signed-stage ledger
        if: ${{ needs.validate-candidate.outputs.preview_release_action == 'package' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-slo-ledger-final-${{ github.run_id }}
          path: ${{ runner.temp }}/release-slo

      - name: Download verification-resume ledger
        if: ${{ needs.validate-candidate.outputs.preview_release_action == 'verify-only' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-slo-ledger-${{ github.run_id }}
          path: ${{ runner.temp }}/release-slo

      - name: Download immutable request attestation
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-request-attestation-${{ inputs.tag }}-${{ inputs.expected_commit }}
          path: ${{ runner.temp }}/release-request

      - name: Install publication tools only when missing
        run: |
          missing_formulae=()
          command -v jq >/dev/null || missing_formulae+=(jq)
          command -v rg >/dev/null || missing_formulae+=(ripgrep)
          if (( ${#missing_formulae[@]} != 0 )); then
            brew install "${missing_formulae[@]}"
          fi

      - name: Publish and verify within the remaining user-wall budget
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUEST_ATTESTATION: ${{ runner.temp }}/release-request/release-request-attestation.json
        run: |
          case "$PREVIEW_RELEASE_ACTION" in
            package|verify-only) ;;
            *) echo "preview release action must be package or verify-only" >&2; exit 2 ;;
          esac
          ledger="$RUNNER_TEMP/release-slo/release-slo.tsv"
          attestation="$RUNNER_TEMP/release-request/release-request-attestation.json"
          RELEASE_REQUEST_STARTED_AT="$(jq -r '.requestStartedAt' "$attestation")"
          RELEASE_READY_AT="$(jq -r '.releaseReadyAt' "$attestation")"
          if [[ "$PREVIEW_RELEASE_ACTION" == "verify-only" ]]; then
            ./scripts/release-slo-ledger.sh finish "$ledger" "$RELEASE_REQUEST_STARTED_AT" environment-approval-and-runner-wait success existing-preview-recovery
          fi
          ./scripts/release-slo-ledger.sh check "$ledger" "$RELEASE_READY_AT" "$PREVIEW_READY_SLO_SECONDS" signed-artifact-transfer
          ./scripts/release-slo-ledger.sh start "$ledger" "$RELEASE_REQUEST_STARTED_AT" publication-and-public-byte-verification

          now="$(date +%s)"
          remaining=$(( PREVIEW_READY_SLO_SECONDS - (now - RELEASE_READY_AT) ))
          if (( remaining > PUBLICATION_MAX_SECONDS )); then
            remaining="$PUBLICATION_MAX_SECONDS"
          fi
          if (( remaining <= 0 )); then
            echo "No user-wall budget remains for publication." >&2
            exit 124
          fi

          head_commit="$(git rev-parse HEAD)"
          base_sha="$(git rev-parse HEAD^)"
          trusted_runner="$RUNNER_TEMP/run-trusted-release-validation.sh"
          git show "${base_sha}:scripts/run-trusted-release-validation.sh" > "$trusted_runner"
          chmod 755 "$trusted_runner"
          test "$head_commit" = "${{ inputs.expected_commit }}"
          REPOSITORY_ROOT="$GITHUB_WORKSPACE" ALLOW_FROZEN_BASE_MAIN=1 "$trusted_runner"
          remote_branch_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | awk 'NR == 1 { print $1 }')"
          test "$remote_branch_head" = "$head_commit"
          if [[ "$PREVIEW_RELEASE_ACTION" == "package" ]]; then
            if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
              git tag -a "$RELEASE_TAG" -m "无线麦SayAll.app $RELEASE_TAG"
            fi
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$head_commit"
            remote_tag_commit="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" | awk 'NR == 1 { print $1 }')"
            if [[ -z "$remote_tag_commit" ]]; then
              git push origin "refs/tags/$RELEASE_TAG"
            else
              test "$remote_tag_commit" = "$head_commit"
            fi
          else
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$head_commit"
          fi

          set +e
          if [[ "$PREVIEW_RELEASE_ACTION" == "verify-only" ]]; then
            ./scripts/run-release-stage.sh all publication "$remaining" -- \
              ./scripts/publish-release.sh verify-prerelease
          else
            ./scripts/run-release-stage.sh all publication "$remaining" -- \
              ./scripts/publish-release.sh prerelease
          fi
          publish_status="$?"
          set -e
          if [[ "$publish_status" == "0" ]]; then
            ./scripts/release-slo-ledger.sh finish "$ledger" "$RELEASE_REQUEST_STARTED_AT" publication-and-public-byte-verification success
            ./scripts/release-slo-ledger.sh check "$ledger" "$RELEASE_READY_AT" "$PREVIEW_READY_SLO_SECONDS" successful-pipeline
          else
            ./scripts/release-slo-ledger.sh finish "$ledger" "$RELEASE_REQUEST_STARTED_AT" publication-and-public-byte-verification failed external-github-or-cdn
            exit "$publish_status"
          fi

      - name: Upload published release ledger
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slo-ledger-published-${{ github.run_id }}
          path: ${{ runner.temp }}/release-slo/release-slo.tsv
          if-no-files-found: error
          retention-days: 90

      - name: Upload failed publication ledger
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slo-ledger-failed-${{ github.run_id }}
          path: ${{ runner.temp }}/release-slo/release-slo.tsv
          if-no-files-found: error
          retention-days: 90

  resume-preview-publication:
    name: Recover and verify failed preview publication
    if: ${{ inputs.release_mode == 'resume-preview' }}
    runs-on: macos-15
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_PIPELINE_DIGEST: ${{ inputs.expected_pipeline_digest }}
      RELEASE_REQUEST_STARTED_AT: ${{ inputs.request_started_at }}
      RELEASE_REQUEST_ID: ${{ inputs.request_id }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
      SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
      SOURCE_ARTIFACT_DIGEST: ${{ inputs.source_artifact_digest }}
      EXPECTED_DEVELOPER_TEAM_ID: L3QHLDRPAY
      EXPECTED_STABLE_TAG: v1.8.3
      ALLOW_FROZEN_BASE_MAIN: 1
      PUBLIC_DOWNLOAD_CONCURRENCY: 4
    steps:
      - name: Check out trusted recovery workflow
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate recovery workflow qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          [[ "$EXPECTED_PIPELINE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$(./scripts/release-pipeline-digest.sh)" = "$EXPECTED_PIPELINE_DIGEST"
          ./scripts/verify-release-pipeline-qualification.sh "$EXPECTED_PIPELINE_DIGEST"

      - name: Install recovery validation tools
        run: |
          command -v jq >/dev/null || brew install jq
          command -v rg >/dev/null || brew install ripgrep

      - name: Recover exact signed artifact and publish without re-signing
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_ACTIONS: true
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_WORKFLOW_REF: HD838A/remote-mic-app/.github/workflows/mac-release-package.yml@${{ github.sha }}
        run: |
          set -euo pipefail
          ledger="$RUNNER_TEMP/release-slo.tsv"
          ./scripts/release-slo-ledger.sh init "$ledger" "$RELEASE_REQUEST_STARTED_AT"
          ./scripts/release-slo-ledger.sh start "$ledger" "$RELEASE_REQUEST_STARTED_AT" publication-and-public-byte-verification
          resume_output="$RUNNER_TEMP/resume-output.txt"
          ./scripts/resume-preview-publication.sh | tee "$resume_output"
          candidate="$(awk -F= '$1 == "candidate" { print substr($0, index($0, "=") + 1) }' "$resume_output")"
          attestation="$(awk -F= '$1 == "request_attestation" { print substr($0, index($0, "=") + 1) }' "$resume_output")"
          candidate_digest="$(awk -F= '$1 == "candidate_pipeline_digest" { print substr($0, index($0, "=") + 1) }' "$resume_output")"
          release_ready_at="$(awk -F= '$1 == "release_ready_at" { print substr($0, index($0, "=") + 1) }' "$resume_output")"
          test -d "$candidate"; test -r "$attestation"
          ./scripts/release-slo-ledger.sh check "$ledger" "$release_ready_at" 1740 signed-artifact-recovery
          ./scripts/run-release-stage.sh all publication 180 -- \
            env \
              RELEASE_SOURCE_ROOT="$candidate" \
              RELEASE_CANDIDATE_BRANCH="release/pre-$RELEASE_TAG" \
              RELEASE_REQUEST_ATTESTATION="$attestation" \
              EXPECTED_PIPELINE_DIGEST="$candidate_digest" \
              RELEASE_TAG="$RELEASE_TAG" \
              RELEASE_REQUEST_ID="$RELEASE_REQUEST_ID" \
              EXPECTED_STABLE_TAG="$EXPECTED_STABLE_TAG" \
              EXPECTED_DEVELOPER_TEAM_ID="$EXPECTED_DEVELOPER_TEAM_ID" \
              ALLOW_FROZEN_BASE_MAIN=1 \
              ./scripts/publish-release.sh resume-prerelease
          ./scripts/release-slo-ledger.sh finish "$ledger" "$RELEASE_REQUEST_STARTED_AT" publication-and-public-byte-verification success
          ./scripts/release-slo-ledger.sh check "$ledger" "$release_ready_at" 1740 successful-pipeline

      - name: Upload recovered publication ledger
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slo-ledger-published-${{ github.run_id }}
          path: ${{ runner.temp }}/release-slo.tsv
          if-no-files-found: error
          retention-days: 90

      - name: Upload failed recovery ledger
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-slo-ledger-failed-${{ github.run_id }}
          path: ${{ runner.temp }}/release-slo.tsv
          if-no-files-found: error
          retention-days: 90
