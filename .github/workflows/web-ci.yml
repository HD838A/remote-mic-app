name: Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/web-ci.yml"
      - "Apps/MobileWeb/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/web-ci.yml"
      - "Apps/MobileWeb/**"

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, and build Web remote
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Apps/MobileWeb

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Apps/MobileWeb/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build production bundles
        run: npm run build
