services:
  relay:
    build:
      context: ../..
      dockerfile: Apps/MobileWeb/Dockerfile
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}"
      STATIC_DIR: "/app/Apps/MobileWeb/web/dist"
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
