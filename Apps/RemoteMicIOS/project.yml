name: RemoteMicIOS

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  RemoteMicIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Info.plist
        buildPhase: resources
    settings:
      base:
        DEVELOPMENT_TEAM: L3QHLDRPAY
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.hd838a.RemoteMicIOS
        PRODUCT_NAME: RemoteMicIOS
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 2
        MARKETING_VERSION: 0.8.3
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  RemoteMicIOS:
    build:
      targets:
        RemoteMicIOS: all
    run:
      config: Debug
    archive:
      config: Release
